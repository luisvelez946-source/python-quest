idth="2"/><text x="470" y="258" text-anchor="middle" fill="#93c5fd" font-size="11">VCC (3.3V)</text></svg></div><div class="tip-box">💡 En pull-up, el pin lee 1 por defecto y cae a 0 al presionar el botón (se dice "activo en bajo"). En pull-down es al revés: lee 0 por defecto y sube a 1 al presionar.</div>` },
