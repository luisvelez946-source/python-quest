<script>
LEVEL_CONTENT[11] = {
    title: "Git y GitHub: la historia de tu código",
    description: "Control de versiones con Git: zonas de trabajo, commits, ramas, merge, conflictos, .gitignore y colaboración con GitHub.",
    challenges: [
        { id: "L11-01", type: "lesson", label: "DESCUBRE", icon: "🌱", title: "Git: la máquina del tiempo de tu código", content: `<p>Imagina que vas guardando versiones de un archivo como <code>programa.py</code>, <code>programa_final.py</code>, <code>programa_final_ahora_si.py</code>... Esa forma de trabajar se vuelve imposible de mantener.</p><p><strong>Git</strong> es un sistema de control de versiones distribuido, creado en 2005 por Linus Torvalds. Permite registrar cambios, volver a estados anteriores, y trabajar en paralelo sin duplicar carpetas.</p><p>Para entender los comandos de Git hay que entender primero por dónde pasa un archivo: tres zonas.</p><div class="circuit-diagram"><svg viewBox="0 0 820 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:780px;display:block;margin:0 auto;"><rect x="20" y="55" width="220" height="110" rx="12" fill="none" stroke="#60a5fa" stroke-width="2"/><text x="130" y="85" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">AREA DE TRABAJO</text><text x="130" y="108" text-anchor="middle" fill="#93c5fd" font-size="12">Working Directory</text><text x="130" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">archivos que editas</text><text x="130" y="148" text-anchor="middle" fill="#94a3b8" font-size="11">main.py, sensores.py...</text><line x1="245" y1="108" x2="295" y2="108" stroke="#f59e0b" stroke-width="2"/><polygon points="300,108 290,102 290,114" fill="#f59e0b"/><text x="270" y="95" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="bold">git add</text><rect x="300" y="55" width="220" height="110" rx="12" fill="none" stroke="#4ade80" stroke-width="2"/><text x="410" y="85" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">AREA DE PREPARACION</text><text x="410" y="108" text-anchor="middle" fill="#86efac" font-size="12">Staging Area</text><text x="410" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">cambios listos</text><text x="410" y="148" text-anchor="middle" fill="#94a3b8" font-size="11">para el proximo commit</text><line x1="525" y1="108" x2="575" y2="108" stroke="#f59e0b" stroke-width="2"/><polygon points="580,108 570,102 570,114" fill="#f59e0b"/><text x="550" y="95" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="bold">git commit</text><rect x="580" y="55" width="220" height="110" rx="12" fill="none" stroke="#f87171" stroke-width="2"/><text x="690" y="85" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">REPOSITORIO</text><text x="690" y="108" text-anchor="middle" fill="#fca5a5" font-size="12">Repository</text><text x="690" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">historial de commits</text><text x="690" y="148" text-anchor="middle" fill="#94a3b8" font-size="11">C1, C2, C3...</text><text x="410" y="200" text-anchor="middle" fill="#64748b" font-size="13">Editar no es lo mismo que preparar, y preparar no es lo mismo que confirmar.</text></svg></div><div class="concept-grid"><div class="concept-item"><strong>git init</strong><span>Crea un repositorio nuevo en la carpeta actual</span></div><div class="concept-item"><strong>git status</strong><span>Muestra en qué zona está cada cambio</span></div><div class="concept-item"><strong>git add</strong><span>Mueve un cambio al área de preparación</span></div><div class="concept-item"><strong>git commit</strong><span>Guarda los cambios preparados en el historial</span></div></div><div class="tip-box">💡 Git no es GitHub: Git funciona localmente en tu computador; GitHub es una plataforma para alojar esos repositorios y colaborar con otras personas.</div>` },

        { id: "L11-02", type: "choice", label: "OBSERVA", icon: "🧭", title: "Git y GitHub: ¿son lo mismo?", question: "¿Cuál afirmación describe mejor la diferencia entre Git y GitHub?", options: ["Git y GitHub son exactamente lo mismo, solo cambia el nombre.", "Git es un sistema de control de versiones que funciona localmente; GitHub es una plataforma para alojar repositorios y colaborar.", "GitHub es el programa que se instala en el computador; Git es la pagina web.", "Git solo sirve para proyectos pequeños y GitHub para proyectos grandes."], correct: 1, xp: 10, correctFeedback: "Correcto. Git puede funcionar sin GitHub; GitHub usa Git por debajo, pero agrega alojamiento remoto, revision y colaboracion.", incorrectFeedback: "Son conceptos distintos: Git es la herramienta de control de versiones; GitHub es un servicio en linea construido sobre Git." },

        { id: "L11-03", type: "choice", label: "OBSERVA", icon: "📸", title: "¿Qué es un commit?", question: "¿Qué representa un commit en Git?", options: ["Una copia completa y manual de la carpeta del proyecto.", "El nombre de una rama.", "Una fotografia del estado del proyecto en un momento dado, con un mensaje que explica el cambio.", "Un archivo que Git ignora automaticamente."], correct: 2, xp: 10, correctFeedback: "Correcto. Cada commit guarda qué cambió, quién lo hizo, cuándo y por qué (en el mensaje), sin duplicar manualmente carpetas.", incorrectFeedback: "Un commit es un punto de guardado del historial, no una copia manual ni el nombre de una rama." },

        { id: "L11-04", type: "choice", label: "RESUELVE", icon: "🗂️", title: "Crear un repositorio", question: "¿Qué hace el comando git init?", options: ["Crea un repositorio Git en la carpeta actual, agregando una carpeta oculta .git.", "Sube el proyecto a GitHub.", "Crea una rama nueva.", "Elimina el historial de commits."], correct: 0, xp: 10, correctFeedback: "Correcto. git init inicializa el repositorio local creando la carpeta oculta .git, donde vivirá todo el historial.", incorrectFeedback: "git init no sube nada a GitHub ni crea ramas: solo inicializa el repositorio local." },

        { id: "L11-05", type: "choice", label: "PREDICE", icon: "❔", title: "Untracked: un archivo que Git aún no sigue", question: "Creaste un archivo nuevo y ejecutas git status. Git lo marca como Untracked. ¿Qué significa esto?", options: ["Que el archivo fue eliminado por error.", "Que el archivo ya quedo incluido en el ultimo commit.", "Que el archivo tiene errores de sintaxis.", "Que el archivo existe en la carpeta, pero Git todavia no le esta haciendo seguimiento."], correct: 3, xp: 10, correctFeedback: "Correcto. Untracked significa que el archivo existe en tu carpeta, pero Git aún no lo sigue: ni está en staging ni en el historial.", incorrectFeedback: "Untracked no tiene que ver con errores de sintaxis ni con eliminación; es solo un archivo que Git todavía no conoce." },

        { id: "L11-06", type: "choice", label: "RESUELVE", icon: "➕", title: "git add main.py vs git add .", question: "¿Cuál es la diferencia entre git add main.py y git add .?", options: ["No hay ninguna diferencia, son sinonimos.", "git add main.py prepara solo ese archivo; git add . prepara todos los cambios de la carpeta actual.", "git add . solo funciona la primera vez que se usa Git.", "git add main.py elimina el archivo del repositorio."], correct: 1, xp: 10, correctFeedback: "Correcto. git add . prepara todo lo que cambió en la carpeta actual; por eso conviene revisar antes con git status.", incorrectFeedback: "git add archivo prepara solo ese archivo; git add . prepara todos los cambios de la carpeta actual, lo cual puede incluir más de lo que querías." },

        { id: "L11-07", type: "builder", label: "CONSTRUYE", icon: "🧱", title: "Flujo básico de trabajo local", question: "Construye el flujo correcto para revisar el estado, preparar tus cambios, confirmarlos con un buen mensaje, y verificar el historial.", pieces: [{ id: "status", text: "git status" }, { id: "addAll", text: "git add ." }, { id: "commitMsg", text: `git commit -m "Agregar lectura de temperatura"` }, { id: "logOneline", text: "git log --oneline" }, { id: "decoyPush", text: "git push origin main" }, { id: "decoyVague", text: `git commit -m "cambios"` }], expected: ["status", "addAll", "commitMsg", "logOneline"], xp: 25, correctFeedback: "Flujo completo: revisar el estado, preparar los cambios, confirmarlos con un mensaje claro (nunca algo como \"cambios\"), y verificar el historial.", incorrectFeedback: "Primero git status, luego git add ., después un commit con mensaje claro, y al final git log --oneline. git push no es parte de este flujo local, y un mensaje vago como \"cambios\" es mala práctica." },

        { id: "L11-08", type: "accessLab", label: "EXPERIMENTA", icon: "🧪", title: "¿Quedará incluido en el próximo commit?", prompt: "Marca las casillas para simular el estado de un archivo y logra que SI quede incluido en el proximo commit.", code: "git add archivo.py     # primera preparacion\n# ...editas el archivo otra vez...\ngit status              # revisa si sigue listo", toggles: [{ id: "staged", label: "El archivo fue preparado con git add" }, { id: "modifiedAfterStaging", label: "El archivo se modificó de nuevo después de prepararlo" }], rule: v => v.staged && !v.modifiedAfterStaging, goal: v => v.staged && !v.modifiedAfterStaging, allowedText: "Sí: está preparado y no ha cambiado desde entonces, así que entra al commit.", deniedText: "No: si no está preparado, o si cambió después de prepararlo, no se incluirá tal cual en el próximo commit.", xp: 20, correctFeedback: "Exacto: preparar con git add toma una foto del archivo en ese momento; si lo modificas después, hay que volver a hacer git add.", incorrectFeedback: "Activa 'preparado con git add' y deja SIN marcar 'modificado después de prepararlo': esa es la única combinación que garantiza que sí entra al commit." },

        { id: "L11-09", type: "choice", label: "RESUELVE", icon: "↩️", title: "Retirar del staging sin perder cambios", question: "Preparaste un archivo con git add, pero decides que todavía no quieres incluirlo en el commit. ¿Qué comando lo retira del staging sin borrar tus cambios?", options: ["git rm archivo", "git reset --hard", "git restore --staged archivo", "git commit --amend"], correct: 2, xp: 10, correctFeedback: "Correcto. git restore --staged saca el archivo del área de preparación, pero conserva tus cambios en la carpeta de trabajo.", incorrectFeedback: "git rm lo elimina, git reset --hard es mucho más destructivo, y --amend modifica el último commit: ninguno de esos solo retira del staging." },

        { id: "L11-10", type: "listLab", label: "PRACTICA", icon: "📋", title: "Simular el área de preparación", varName: "staging_area", unit: "archivos preparados", numeric: false, initialItems: ["main.py"], actions: [{ id: "addSensores", label: "git add sensores.py", op: "append", value: "sensores.py" }, { id: "restoreMain", label: "git restore --staged main.py", op: "remove", value: "main.py" }, { id: "countStaged", label: "len(staging_area)", op: "count" }], steps: [{ instruction: "Agregaste conscientemente sensores.py a la próxima foto del proyecto.", action: "addSensores" }, { instruction: "Te das cuenta de que main.py todavía no debía incluirse: retíralo del staging, sin borrar tus cambios.", action: "restoreMain" }, { instruction: "Verifica cuántos archivos quedaron preparados para el próximo commit.", action: "countStaged" }], xp: 20, correctFeedback: "staging_area quedó solo con sensores.py: retirar del staging no borra tu trabajo, solo lo saca de la próxima foto.", incorrectFeedback: "Lee la instrucción y elige la operación que representa ese cambio en el área de preparación." },

        { id: "L11-11", type: "lesson", label: "DESCUBRE", icon: "🌿", title: "Ramas: trabajar sin romper main", content: `<p>Una <strong>rama</strong> (branch) permite desarrollar algo en paralelo sin tocar la versión principal. Si algo sale mal, basta con no fusionarla.</p><pre class="code-block"><code>git switch -c sensores</code></pre><pre class="code-block"><code># ...trabajas, agregas y haces commits en sensores...</code></pre><pre class="code-block"><code>git switch main</code></pre><pre class="code-block"><code>git merge sensores</code></pre><div class="circuit-diagram"><svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:720px;display:block;margin:0 auto;"><line x1="40" y1="240" x2="680" y2="240" stroke="#475569" stroke-width="2"/><text x="40" y="270" fill="#60a5fa" font-size="14" font-weight="bold">main</text><circle cx="100" cy="240" r="9" fill="#0f172a" stroke="#60a5fa" stroke-width="3"/><text x="100" y="220" text-anchor="middle" fill="#93c5fd" font-size="12">C1</text><circle cx="260" cy="240" r="9" fill="#0f172a" stroke="#60a5fa" stroke-width="3"/><text x="260" y="220" text-anchor="middle" fill="#93c5fd" font-size="12">C2</text><line x1="260" y1="235" x2="260" y2="140" stroke="#4ade80" stroke-width="2"/><line x1="260" y1="140" x2="680" y2="140" stroke="#4ade80" stroke-width="2"/><text x="275" y="125" fill="#4ade80" font-size="14" font-weight="bold">sensores</text><circle cx="380" cy="140" r="9" fill="#0f172a" stroke="#4ade80" stroke-width="3"/><text x="380" y="120" text-anchor="middle" fill="#86efac" font-size="12">S1</text><circle cx="500" cy="140" r="9" fill="#0f172a" stroke="#4ade80" stroke-width="3"/><text x="500" y="120" text-anchor="middle" fill="#86efac" font-size="12">S2</text><line x1="505" y1="145" x2="615" y2="233" stroke="#f59e0b" stroke-width="2"/><polygon points="620,238 608,230 610,242" fill="#f59e0b"/><circle cx="620" cy="240" r="11" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/><text x="620" y="268" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">MERGE</text><text x="380" y="295" text-anchor="middle" fill="#64748b" font-size="13">git switch main, luego git merge sensores: trae los cambios de sensores hacia main.</text></svg></div><div class="tip-box">💡 git merge sensores significa: "trae los cambios de sensores hacia la rama donde estoy ubicado ahora". Por eso siempre conviene revisar git branch antes de fusionar.</div>` },

        { id: "L11-12", type: "choice", label: "OBSERVA", icon: "🌱", title: "¿Qué es una rama?", question: "¿Qué es una rama (branch) en Git?", options: ["Una línea de desarrollo independiente que permite trabajar en algo sin afectar la versión principal.", "Una copia de GitHub guardada en el computador.", "Un tipo de commit especial que no se puede eliminar.", "El nombre que recibe siempre el primer commit."], correct: 0, xp: 10, correctFeedback: "Correcto. Una rama permite experimentar o construir una funcionalidad en paralelo, sin modificar directamente la versión estable.", incorrectFeedback: "Una rama no es una copia de GitHub ni un tipo de commit especial; es una línea de desarrollo independiente." },

        { id: "L11-13", type: "choice", label: "RESUELVE", icon: "🔀", title: "Crear y cambiar de rama en un paso", question: "¿Cuál comando crea una rama nueva llamada interfaz y cambia a ella en un solo paso?", options: ["git branch interfaz", "git switch interfaz", "git merge interfaz", "git switch -c interfaz"], correct: 3, xp: 10, correctFeedback: "Correcto. git switch -c crea la rama y cambia a ella de inmediato; git branch solo la crea, sin cambiar hacia ella.", incorrectFeedback: "git branch interfaz solo crea la rama (no te mueve a ella), y git switch interfaz fallaría si la rama no existe aún. La forma de hacer ambas cosas a la vez es git switch -c." },

        { id: "L11-14", type: "listLab", label: "PRACTICA", icon: "📋", title: "Simular las ramas del repositorio", varName: "ramas", unit: "ramas activas", numeric: false, initialItems: ["main", "sensores"], actions: [{ id: "branchInterfaz", label: "git branch interfaz", op: "append", value: "interfaz" }, { id: "deleteSensores", label: "git branch -d sensores", op: "remove", value: "sensores" }, { id: "countBranches", label: "git branch", op: "count" }], steps: [{ instruction: "Vas a empezar la interfaz gráfica: crea la rama (sin cambiarte a ella todavía).", action: "branchInterfaz" }, { instruction: "Ya fusionaste 'sensores' hacia main con merge: elimínala porque ya no la necesitas.", action: "deleteSensores" }, { instruction: "Revisa cuántas ramas quedan activas en el repositorio.", action: "countBranches" }], xp: 20, correctFeedback: "Quedan main e interfaz: una rama ya fusionada se puede eliminar con git branch -d sin perder nada, porque su historial ya vive en main.", incorrectFeedback: "Piensa en qué comando de la lista corresponde a esa acción sobre las ramas." },

        { id: "L11-15", type: "builder", label: "CONSTRUYE", icon: "🧱", title: "Flujo completo de ramas", question: "Construye el flujo para crear una rama, trabajar en ella, confirmar los cambios, y luego fusionarla hacia main.", pieces: [{ id: "branchSwitch", text: "git switch -c sensores" }, { id: "editFile", text: "nano sensores.py" }, { id: "addFile", text: "git add sensores.py" }, { id: "commitBranch", text: `git commit -m "Agregar sensor de temperatura"` }, { id: "switchMain", text: "git switch main" }, { id: "mergeBranch", text: "git merge sensores" }, { id: "decoyDelete", text: "git branch -d sensores" }, { id: "decoySwitchAgain", text: "git switch sensores" }], expected: ["branchSwitch", "editFile", "addFile", "commitBranch", "switchMain", "mergeBranch"], xp: 25, correctFeedback: "Rama creada, cambios confirmados en ella, y luego fusionada hacia main con merge: ese es el flujo completo.", incorrectFeedback: "Primero crea y cambia a la rama, trabaja y confirma ahí, vuelve a main, y recién ahí haz el merge. Eliminar la rama sería un paso posterior, no parte de este flujo." },

        { id: "L11-16", type: "choice", label: "PREDICE", icon: "💥", title: "¿Cuándo aparece un merge conflict?", question: "¿Cuándo ocurre un merge conflict?", options: ["Cada vez que se usa git merge, sin excepcion.", "Cuando dos ramas modificaron la misma parte del mismo archivo y Git no puede decidir cual version conservar.", "Cuando se elimina una rama que ya fue fusionada.", "Cuando el archivo .gitignore esta vacio."], correct: 1, xp: 10, correctFeedback: "Correcto. Git combina automáticamente la mayoría de los cambios; solo se detiene cuando dos ramas tocaron exactamente la misma zona.", incorrectFeedback: "No todo merge genera conflicto: Git solo se detiene cuando dos ramas cambiaron la misma parte del mismo archivo." },

        { id: "L11-17", type: "accessLab", label: "EXPERIMENTA", icon: "🧪", title: "¿Se genera un conflicto?", prompt: "Simula si dos ramas chocan al fusionarse: actívalas para lograr un merge conflict.", code: `ramaA:  estado = "NORMAL"\nramaB:  estado = "ALARMA"   # misma linea, mismo archivo`, toggles: [{ id: "ramaA", label: "La rama A modificó la línea 12 del archivo" }, { id: "ramaB", label: "La rama B modificó esa misma línea 12" }], rule: v => v.ramaA && v.ramaB, goal: v => v.ramaA && v.ramaB, allowedText: "Conflicto: ambas ramas tocaron la misma línea, Git no puede decidir solo cuál conservar.", deniedText: "Sin conflicto: como no hay cambios superpuestos, Git puede fusionar automáticamente.", xp: 20, correctFeedback: "Así es: el conflicto solo aparece cuando dos ramas cambian exactamente la misma parte del mismo archivo.", incorrectFeedback: "Activa las dos casillas: el conflicto necesita que ambas ramas hayan tocado la misma línea." },

        { id: "L11-18", type: "choice", label: "DEMUESTRA", icon: "🏷️", title: "Leer los marcadores de conflicto", question: "En un conflicto, Git muestra algo como: <<<<<<< HEAD ... ======= ... >>>>>>> sensores. ¿Qué representa la sección entre <<<<<<< HEAD y =======?", options: ["Los cambios de la rama que se esta fusionando.", "Una version que ya fue eliminada.", "Los cambios de la rama actual (donde estas ubicado).", "Codigo roto que Git genero automaticamente."], correct: 2, xp: 15, correctFeedback: "Correcto. Entre <<<<<<< HEAD y ======= está tu rama actual; entre ======= y >>>>>>> sensores está la rama que se está fusionando.", incorrectFeedback: "HEAD siempre representa dónde estás parado ahora mismo: esa es la sección de tu rama actual, no la que se está fusionando." },

        { id: "L11-19", type: "choice", label: "RESUELVE", icon: "🙈", title: "El archivo .gitignore", question: "¿Para qué sirve un archivo .gitignore?", options: ["Para indicarle a Git que archivos o carpetas NO debe rastrear, como entornos virtuales o credenciales.", "Para eliminar archivos del computador.", "Para forzar que todos los archivos se suban a GitHub.", "Para renombrar archivos automaticamente."], correct: 0, xp: 10, correctFeedback: "Correcto. Archivos temporales, entornos virtuales, credenciales (.env) o compilados no deberían viajar con el historial del proyecto.", incorrectFeedback: ".gitignore no borra ni renombra nada en tu computador: solo le dice a Git qué debe ignorar al preparar cambios." },

        { id: "L11-20", type: "choice", label: "OBSERVA", icon: "☁️", title: "De Git a GitHub", question: "Después de git clone https://github.com/usuario/proyecto.git, ¿cómo se llama por defecto el repositorio remoto del que Git descargó el proyecto?", options: ["main", "HEAD", "origin", "root"], correct: 2, xp: 10, correctFeedback: "Correcto. origin es el nombre convencional que Git asigna al repositorio remoto principal; no significa GitHub en sí, podría llamarse de otra forma.", incorrectFeedback: "main es el nombre de una rama, HEAD apunta al commit actual: el nombre del remoto es origin." },

        { id: "L11-21", type: "choice", label: "DEMUESTRA", icon: "🔁", title: "Integrar cambios con revisión", question: "Terminaste de trabajar una nueva funcionalidad en tu propia rama y quieres proponer que se integre a main en GitHub, con revisión de tus compañeros. ¿Qué deberías crear?", options: ["Un nuevo repositorio en GitHub desde cero.", "Un archivo .gitignore con los cambios.", "Un git reset --hard sobre main.", "Un Pull Request, para que revisen y aprueben los cambios antes de fusionarlos."], correct: 3, xp: 15, correctFeedback: "Misión completada. Un Pull Request convierte el merge en una conversación visible: comentarios, cambios solicitados, aprobación y trazabilidad.", incorrectFeedback: "No hace falta un repositorio nuevo, ni .gitignore, ni mucho menos un reset --hard: lo que propone revisar e integrar cambios de una rama es el Pull Request." }
    ]
};
</script>
