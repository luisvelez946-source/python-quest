        { id: "L8-16", type: "lesson", label: "DESCUBRE", icon: "λ", title: "Expresiones lambda: funciones de una sola línea", content: `<p>Una <strong>lambda</strong> es una función anónima: no necesita <code>def</code>, no se le pone nombre y no lleva <code>return</code>. Solo puede contener <strong>una expresión</strong>, y el resultado de esa expresión es lo que devuelve.</p><pre class="code-block"><code># Con def, la forma normal de escribir una función
def cuadrado(x):
    return x * x

# La misma idea como lambda
cuadrado = lambda x: x * x

print(cuadrado(5))</code></pre><p>La sintaxis siempre sigue este orden: <code>lambda parámetros: expresión</code>. Sin paréntesis alrededor del parámetro, sin dos puntos antes de <code>lambda</code>, y sin la palabra <code>return</code>.</p><div class="concept-grid"><div class="concept-item"><strong>lambda x: x * 2</strong><span>Duplica un valor</span></div><div class="concept-item"><strong>lambda a, b: a + b</strong><span>Admite varios parámetros</span></div><div class="concept-item"><strong>map(func, lista)</strong><span>Aplica una función a cada elemento</span></div><div class="concept-item"><strong>sorted(lista, key=...)</strong><span>Usa una lambda para decidir el orden</span></div></div><div class="tip-box">💡 Una lambda sirve para funciones cortas y de un solo uso, como escalar una lectura de sensor o definir un criterio de orden. Si la lógica necesita varias líneas, condicionales completos o bucles, se debe usar una función normal con def.</div>` },
